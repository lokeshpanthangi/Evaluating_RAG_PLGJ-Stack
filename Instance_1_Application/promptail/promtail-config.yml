server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://MONITORING_HOST:3100/loki/api/v1/push

scrape_configs:
  - job_name: rag-app
    static_configs:
      - targets: [localhost]
        labels:
          job: rag-app
          __path__: /home/ubuntu/rag-app/logs/app.log
